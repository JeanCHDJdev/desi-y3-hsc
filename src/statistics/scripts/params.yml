---

# Username.
username: "qlavier" # type : str. Default : "qlavier". Username to use for file paths.

bash:
# bash parameters
    qos: "interactive" # type : str (among "interactive", "regular"). Default : "regular". Whether to run the jobs interactively (for tests, for 1 CORRELATION MAX /!\) or in regular mode.
    job_name: "" # type : str. Default : "". Name of the job to run (for regular mode).
    proc: "cpu" # type : str (among "cpu", "gpu"). Default : "cpu". Whether to run the jobs on CPU or GPU.
    ntasks_per_node: 1 # type : int. Default : 1. Number of tasks per node to request for each job.
    cpus_per_task: 256 # type : int. Default : 256. Number of CPUs per task to request for each job. Only used if proc is "cpu".
    memory: "128GB" # type : str. Default : "128GB". Amount of memory to request for each job.
    time: "02:00:00" # type : str. Default : "06:00:00". Time to request for each job (format HH:MM:SS). For interactive jobs, high time will violate QOS policy.
    account: "desi" # type : str. Default : "desi". Account to use for the job submission.

data:
# HSC data catalog
    hsc_catalog: "hscpdr3_i25_imagerr" # type : str (among "hscy3_cat_withflags", "hscpdr3_i25_imagerr"). Default : "hsc_cat_withflags". HSC catalog to use.
# DESI data release
    desi_data_release: "dr2" # type : str (among "dr1", "dr2"). Default : "dr2". DESI data release to use.

bins:
# HSC bins: {number: [start, end]}. type : dict. Default: {1: [0.3, 0.6], 2: [0.6, 0.9], 3: [0.9, 1.2], 4: [1.2, 1.5]}. If not empty, will use these bins for HSC.
    hsc: {
        1: [0.3, 0.6],
        2: [0.6, 0.9],
        3: [0.9, 1.2],
        4: [1.2, 1.5],
        5: [1.5, 2.0],
        6: [2.0, 2.5],
        7: [2.5, 6.0]
    }
# DESI tracer bins : {tracer: [start, end, spacing]}. type : dict. Default: {"BGS_ANY": [0.0, 0.6, 0.05], "LRG": [0.3, 1.2, 0.05], "ELGnotqso": [0.7, 1.6, 0.05], "QSO": [0.7, 2.8, 0.05]}. If not empty, will use these bins for the DESI tracers.
    desi: {
        BGS_ANY: [0.0, 0.6, 0.05],
        "LRG": [0.3, 1.2, 0.05],
        "ELGnotqso": [0.7, 1.6, 0.05],
        "QSO": [0.7, 2.8, 0.05]
    }

tpcf:
# parameters to enter for correlation computation
    cross_correlations: [] # type : list of str (among "BGS_ANY", "LRG", "ELGnotqso", "QSO"). Default : ["BGS_ANY", "LRG", "ELGnotqso", "QSO"]. DESI tracers to cross-correlate with HSC.
    auto_correlations: ["BGS_ANY"] # type : list of str (among "BGS_ANY", "LRG", "ELGnotqso", "QSO", "HSC"). Default : ["BGS_ANY", "LRG", "ELGnotqso", "QSO", "HSC"]. Targets to compute auto-correlations for.
    areas: [1, 3] # type : list of int (among 1, 2, 3, 4). Default : [1, 3]. Areas of the sky to cross-correlate. 1, 4 = NGC; 2, 3 = SGC.
    jackknife: True # type : bool. Default : True. Wether to perform cross correlation with jackknife estimates.
    nsamples: 64 # type : int. Default : 64. Number of jackknife samples.

advanced:
# advanced correlation parameters
    output_dir: "../crosscorr/new/" # type : str. Default : "". Path to the output file (storing the auto & cross correlations).
    estimator: "davispeebles" # type : str (among "davispeebles", "landyszalay", "peebleshauser"). Default : "davispeebles". Correlation estimator to use.
    resolution: 256 # type : int. Default : 256. Healpix pixel resolution for jackknife subsampling.
    sample_rate_1: 1 # type : int. Default : 1. Sampling rate for DESI randoms.
    sample_rate_2: 1 # type : int. Default : 1. Sampling rate for HSC randoms catalog.
    weight: "nonKP" # type : str (among "nonKP", "PIP", "base"). Default : "nonKP". Weighting scheme to use.
    skip_moc: [False, True] # type : list of bool. Default : [False, True]. Whether to skip the MOC masking. 1st is for cross-correlations, 2nd is for auto-correlations. 0: no simulation.
    z_bin: False # type : bool. Default : False. Wether to bin by the redshift column or the z_bin column.
    sims: 0 # type : int. Default : 0. Among 0, 1, 2, 3, 4, 5. Whether to use the simulated data, and which version.
    corr_type: "theta" # type : str (among "theta", "rp"). Default : "theta". Type of correlation to run.
    log: False # type : bool. Default : False. Log file to store run settings.
    nproc: None # type : int. Default : os.cpu_count()-2. Number of threads to use for correlation.

nz:
# parameters to enter for redshift distributions plots
    tomo_bins: [5] # type : list of int (among 1, 2, 3, 4, 5, 6, 7). Default : [1, 2, 3, 4]. Tomographic bins to consider for the redshift distribution.
    tomo_to_tracer: {
        1: ["BGS_ANY", "LRG"],
        2: ["BGS_ANY", "LRG", "QSO"],
        3: ["LRG", "QSO"],
        4: ["LRG", "QSO"],
        5: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"],
        6: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"],
        7: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"]
    } # type : dict. Default : {1: ["BGS_ANY", "LRG"], 2: ["BGS_ANY", "LRG", "QSO"], 3: ["LRG", "QSO"], 4: ["LRG", "QSO"], 5: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"], 6: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"], 7: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"]}. Which DESI tracers to consider for each tomo bin.
    scale_cut: [0.3, 3] # type : list of two floats (among [0.3, 3] and [1, 5]). Default : [0.3, 3]. Minimal and maximal distances used for the correlations (in Mpc/h).
    areas: [1, 3] # type : list of int (among 1, 2, 3, 4). Default : [1, 3]. Areas of the sky to consider for the redshift distribution. 1, 4 = NGC; 2, 3 = SGC.
    version: "vF" # type : str (among "vF", "vtest"). Default : "vF". Version of the merged files used.

nz_splines:
# parameters to enter for redshift distributions plots with spline fits
    tomo_bins: [5] # type : list of int (among 1, 2, 3, 4, 5, 6, 7). Default : [1, 2, 3, 4]. Tomographic bins to consider for the redshift distribution.
    tomo_to_tracer: {
        1: ["BGS_ANY", "LRG"],
        2: ["BGS_ANY", "LRG", "QSO"],
        3: ["LRG", "QSO"],
        4: ["LRG", "QSO"],
        5: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"],
        6: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"],
        7: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"]
    } # type : dict. Default : {1: ["BGS_ANY", "LRG"], 2: ["BGS_ANY", "LRG", "QSO"], 3: ["LRG", "QSO"], 4: ["LRG", "QSO"], 5: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"], 6: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"], 7: ["BGS_ANY", "LRG", "ELGnotqso", "QSO"]}. Which DESI tracers to consider for each tomo bin.
    scale_cut: [0.3, 3] # type : list of two floats (among [0.3, 3] and [1, 5]). Default : [0.3, 3]. Minimal and maximal distances used for the correlations (in Mpc/h).
    areas: [1, 3] # type : list of int (among 1, 2, 3, 4). Default : [1, 3]. Areas of the sky to consider for the redshift distribution. 1, 4 = NGC; 2, 3 = SGC.
    version: "vF" # type : str (among "vF", "vtest"). Default : "vF". Version of the merged files used.
    z_range: [0, 3, 1000] # type : list of three floats. Default : [0, 3, 1000]. Minimal, maximal and number of points for the redshift range to consider for the spline fits.
    a0_range: [0.05, 0.1, 0.5, 1, 10] # type : list of floats. Default : [0.05, 0.1, 0.5, 1, 10]. Range of a0 parameters to consider for the spline fits.

...